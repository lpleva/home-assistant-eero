
set_blocked_apps:
  fields:
    blocked_apps:
      required: True
      example: netflix
    target_profile:
      required: False
      example: John Doe or 1234567
    target_network:
      required: False
      example: My Network or 1234567

set_reservation:
  fields:
    mac:
      required: True
      example: "aa:bb:cc:dd:ee:ff"
    ip:
      required: True
      example: "192.168.4.65"
    name:
      required: False
      example: "Chloe iPad"
    target_network:
      required: False
      example: My Network or 1234567

delete_reservation:
  fields:
    mac:
      required: True
      example: "aa:bb:cc:dd:ee:ff"
    target_network:
      required: False
      example: My Network or 1234567
